name: "Extension Bug Report"
description: "Bugs related to the Extension itself. Use the Lyric templates for Lyric issues."
title: "Summarize the Bug/Issue Here"
labels: ["Extension Bug"]

body:
  - type: dropdown
    id: "installation-type"
    attributes:
      label: "How did you install Just Enough Lyrics?"
      multiple: false
      options:
        - Marketplace
        - Windows installer (install.ps1)
        - Manually
    validations:
      required: true
  - type: textarea
    id: "explanation"
    attributes:
      label: "What is the Bug/Issue?"
      description: "How did you expect it to work? If applicable, provide screenshots of the Bug/Issue!"
    validations:
      required: true
  - type: input
    id: "country"
    attributes:
      label: "What Country are you from?"
      description: "Optional. Include your country if the issue appears to depend on regional lyric availability."
      placeholder: "United States"
  - type: dropdown
    id: "os"
    attributes:
      label: "What Operating System are you using?"
      multiple: false
      options:
        - Windows
        - MacOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: "local-information"
    attributes:
      label: "Spotify/Spicetify Information"
      description: "Include your Spotify and Spicetify versions, plus the Just Enough Lyrics version shown by JustEnoughLyrics.version in DevTools."
    validations:
      required: true
  - type: textarea
    id: "extension-information"
    attributes:
      label: "Reproduction details and screenshots"
      description: "Include the steps, affected lyric view, and track URI/timestamp when relevant. If you share console output, redact credentials and tokens."